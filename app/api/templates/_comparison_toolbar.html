<form class="comparison-toolbar" action="/backtests/compare" method="get" data-comparison-form>
  <a class="button" href="/backtests/select">先選區間比較 →</a>
  <div><strong>或快速勾選兩筆</strong><p class="muted" data-comparison-status>已選 0 / 2 筆，可跨版本頁選擇</p></div>
  <div class="comparison-selection" data-comparison-selection></div>
  <div data-comparison-inputs></div>
  <button class="small-action" type="submit" disabled data-comparison-submit>比較兩筆回測 →</button>
  <button class="comparison-clear" type="button" data-comparison-clear>清除</button>
</form>
