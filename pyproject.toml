[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading"
version = "0.1.0"
description = "Crypto quant research and trading infrastructure"
requires-python = ">=3.12"
dependencies = [
  "ccxt>=4,<5",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
